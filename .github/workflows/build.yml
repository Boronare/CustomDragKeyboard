name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core and build debug APK
        run: ./gradlew :core:test :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CustomDragKeyboard-debug
          path: app/build/outputs/apk/debug/*.apk
      # 로그인 없이 폰에서도 받을 수 있도록 최신 빌드를 "latest-debug" 프리릴리스에 올린다
      - name: Publish APK to the latest-debug pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CustomDragKeyboard-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug CustomDragKeyboard-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "최신 디버그 빌드" \
            --notes "${GITHUB_REF_NAME} 브랜치 커밋 ${GITHUB_SHA::7}에서 자동으로 빌드했습니다 (빌드 ${GITHUB_RUN_NUMBER}). 아래 CustomDragKeyboard-debug.apk를 받아 설치하세요."
